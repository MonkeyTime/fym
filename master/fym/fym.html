<!DOCTYPE html>

<html class="fym-popup" lang="en">
  <head>
    <meta charset="utf-8">
    <title>Chrome: FYM - Home</title>
    <link rel="stylesheet" href="style.css">
    <meta itemprop="description" content="Extension for Chromium navigators: FYM - Free Your Mind">
  </head>
  <body class="fym-popup-body">
    <main class="fym-card" aria-live="polite">
      <header class="fym-header">
        <div>
          <h1>FYM</h1>
          <p>Free Your Mind</p>
        </div>
        <img src="icon48.png" alt="">
      </header>

      <form id="alert-form" class="fym-form" action="">
        <section id="reminderDialog" class="fym-dialog" aria-label="Add a page reminder">
          <div class="fym-field">
            <label id="labelUrl" for="url">Choose url</label>
            <div class="fym-url-row">
              <input id="url" name="url" type="url" placeholder="click ADD to add current url or copy/past one url" required>
              <button id="add" type="button" class="fym-icon-button" title="Add current page">Add</button>
            </div>
          </div>

          <div id="whenBtnAddIsClicked" class="fym-details" hidden>
            <div class="fym-field">
              <label id="labelTitle" for="title">Choose title</label>
              <input id="title" name="title" type="text" placeholder="Choose one title" required>
            </div>

            <figure id="capturePreview" class="fym-preview" hidden>
              <img id="previewImage" alt="">
              <figcaption id="captureStatus"></figcaption>
            </figure>

            <div id="reminderModeTabs" class="fym-tabs" role="tablist" aria-label="Reminder mode">
              <button id="datetime" type="button" class="fym-tab is-active" aria-selected="true">date & clock</button>
              <button id="countdown" type="button" class="fym-tab" aria-selected="false">countdown</button>
            </div>

            <div id="datetimer" class="fym-field fym-grid">
              <label id="labelDateTime" for="date">Choose by date @ clock</label>
              <input id="date" name="date" type="date">
              <input id="time" name="time" type="time">
            </div>

            <div id="counter" class="fym-field fym-grid" hidden>
              <label id="labelDayCount" for="day">Choose in n days, n hours, n mins</label>
              <input id="day" name="day" type="number" min="0" placeholder="number of day(s)">
              <input id="count" name="count" type="time" value="00:30">
            </div>
          </div>

          <input id="imgData" name="imgData" type="hidden">
          <input id="lang" name="lang" type="hidden">
        </section>

        <footer class="fym-actions">
          <button id="clear" type="button" class="fym-secondary">Clear</button>
          <button id="validate" type="submit" class="fym-primary">Validate</button>
        </footer>
        <p id="message" class="fym-message" role="status" hidden></p>
      </form>
    </main>

    <script src="fym.js" type="text/javascript"></script>
  </body>
</html>
